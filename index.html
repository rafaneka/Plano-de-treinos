<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gym Braun-Apple</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --braun-black: #000000;
            --braun-dark-grey: #1C1C1E; /* Cor Apple Dark Mode */
            --braun-orange: #FF5500;
            --braun-light: #FFFFFF;
            --apple-grey: #2C2C2E;
            --squircle: 22px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, sans-serif; 
            background: var(--braun-black); 
            color: var(--braun-light);
            margin: 0; 
            padding-top: 130px; 
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* Bloqueio de Rotação Visual */
        #orientation-lock {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--braun-black);
            z-index: 9999; text-align: center; justify-content: center; align-items: center;
            flex-direction: column;
        }

        @media screen and (orientation: landscape) {
            #orientation-lock { display: flex; }
        }

        /* Header Laranja (Braun Style) */
        #timer-bar { 
            position: fixed; top: 0; width: 100%; 
            background: var(--braun-orange); 
            color: white; 
            padding: 55px 0 15px; 
            text-align: center; z-index: 100;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Navegação Squircles */
        .nav-days { 
            display: flex; overflow-x: auto; padding: 15px; gap: 12px; 
            background: rgba(28, 28, 30, 0.8); 
            backdrop-filter: blur(10px);
            position: sticky; top: 110px; z-index: 90;
        }
        .tab-btn { 
            padding: 12px 24px; border-radius: 14px; border: none; 
            background: var(--apple-grey); color: var(--braun-light);
            font-size: 13px; font-weight: 600; white-space: nowrap;
            transition: all 0.2s;
        }
        .tab-btn.active { background: var(--braun-light); color: var(--braun-black); }
        .tab-history { background: var(--braun-orange) !important; color: white !important; }

        /* Cards Squircles (Apple Style) */
        .exercise-card { 
            background: var(--braun-dark-grey); margin: 15px; padding: 22px; 
            border-radius: var(--squircle);
        }
        .ex-name { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
        .ex-meta { color: #8E8E93; font-size: 13px; margin-bottom: 18px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .track-row { display: flex; gap: 12px; align-items: center; }
        input[type="text"] { 
            background: #2C2C2E; border: none; 
            color: white; padding: 14px; width: 85px; border-radius: 14px; 
            font-size: 16px; text-align: center; font-weight: 600;
        }
        .check-btn { 
            flex-grow: 1; background: var(--apple-grey); color: white; border: none; 
            padding: 14px; font-weight: 700; border-radius: 14px; text-transform: uppercase;
        }
        .check-btn.done { background: var(--braun-orange); }

        /* Histórico */
        .history-container { padding: 20px; }
        canvas { 
            background: #1C1C1E; padding: 15px; margin-bottom: 30px; 
            border-radius: var(--squircle); 
        }

        .action-footer { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; gap: 15px; }
        .btn-action { 
            background: var(--apple-grey); border: none; color: var(--braun-light); 
            padding: 16px; border-radius: 16px; font-size: 14px; font-weight: 600;
        }
        .btn-danger { color: #FF453A; background: rgba(255, 69, 58, 0.15); }

    </style>
</head>
<body>

<div id="orientation-lock">
    <div style="font-size: 50px;">📱</div>
    <h2 style="margin-top:20px">Roda o iPhone para a Vertical</h2>
    <p style="color: #888">Esta app foi desenhada para ser usada em modo retrato.</p>
</div>

<div id="timer-bar">
    <div id="timer-display">STOPWATCH: 00:00</div>
    <div style="margin-top:10px; display: flex; justify-content: center; gap: 10px;">
        <button class="tab-btn" style="background:rgba(0,0,0,0.3); padding: 8px 15px;" onclick="startTimer(60)">+60S</button>
        <button class="tab-btn" style="background:rgba(0,0,0,0.3); padding: 8px 15px;" onclick="resetTimer()">OFF</button>
    </div>
</div>

<div class="nav-days" id="day-tabs"></div>

<div id="main-content"></div>

<script>
    const defaultPlan = {
        'A1': { title: 'A1', exercises: ['Supino com Halteres', 'Remada Curvada com Barra', 'Press Militar com Halteres', 'Lat Pulldown na Polia', 'Tríceps Corda + Bíceps Martelo']},
        'B1': { title: 'B1', exercises: ['Agachamento / Leg Press', 'Peso Morto Romeno', 'Leg Extension Máquina', 'Gémeos em Pé', 'Máquina de Abdominais']},
        'A2': { title: 'A2', exercises: ['Supino Inclinado c/ Halteres', 'Remada Baixa no Cabo', 'Elevação Laterais Halteres', 'Face Pulls Polia Alta', 'Fundos ou Flexões']},
        'B2': { title: 'B2', exercises: ['Lunges Dinâmicos', 'Leg Curl Sentado/Deitado', 'Goblet Squat com Halteres', 'Prancha Abdominal', 'Gémeos Sentado Máquina']}
    };

    let plan = JSON.parse(localStorage.getItem('gym_plan')) || defaultPlan;
    let logs = JSON.parse(localStorage.getItem('gym_logs')) || {};
    let history = JSON.parse(localStorage.getItem('gym_history')) || [];
    let currentTab = 'A1';
    let timerInterval;

    function save() {
        localStorage.setItem('gym_plan', JSON.stringify(plan));
        localStorage.setItem('gym_logs', JSON.stringify(logs));
        localStorage.setItem('gym_history', JSON.stringify(history));
    }

    function renderTabs() {
        const container = document.getElementById('day-tabs');
        let html = Object.keys(plan).map(day => `
            <button class="tab-btn ${day === currentTab ? 'active' : ''}" onclick="switchTab('${day}')">${day}</button>
        `).join('');
        html += `<button class="tab-btn tab-history ${currentTab === 'HIST' ? 'active' : ''}" onclick="switchTab('HIST')">HISTÓRICO</button>`;
        container.innerHTML = html;
    }

    function switchTab(tab) {
        currentTab = tab;
        renderTabs();
        window.scrollTo(0,0);
        if(tab === 'HIST') renderHistory(); else renderExercises();
    }

    function renderExercises() {
        const container = document.getElementById('main-content');
        const data = plan[currentTab];
        container.innerHTML = data.exercises.map((ex, i) => {
            const val = logs[`${currentTab}-${ex}`] || "";
            return `
                <div class="exercise-card">
                    <div class="ex-name">${ex}</div>
                    <span class="ex-meta">Carga Atual</span>
                    <div class="track-row">
                        <input type="text" inputmode="decimal" placeholder="KG" value="${val}" onchange="saveLog('${currentTab}-${ex}', this.value)">
                        <button class="check-btn" onclick="this.classList.toggle('done'); if(this.classList.contains('done')) startTimer(60)">SET DONE</button>
                    </div>
                </div>
            `;
        }).join('') + `
            <div class="action-footer">
                <button class="btn-action" style="background: var(--braun-orange); color: white;" onclick="handleReset()">Finalizar Treino e Guardar</button>
                <button class="btn-action" onclick="handleSimpleReset()">Reset</button>
            </div>
        `;
    }

    function saveLog(key, val) { logs[key] = val; save(); }

    function handleSimpleReset() {
        if(confirm("Limpar marcas de 'Feito' e cargas sem guardar no histórico?")) {
            logs = {}; save(); renderExercises();
        }
    }

    function handleReset() {
        if(!confirm("Desejas guardar estas cargas no histórico e limpar o treino atual?")) return;
        const snapshot = { date: new Date().toLocaleDateString(), data: {...logs} };
        history.push(snapshot);
        logs = {};
        save();
        renderExercises();
    }

    function clearHistory() {
        const firstCheck = confirm("Tens a certeza que queres APAGAR TODO o histórico de progresso?");
        if(firstCheck) {
            const secondCheck = confirm("ESTA AÇÃO É IRREVERSÍVEL. Confirmas a eliminação de todos os gráficos?");
            if(secondCheck) {
                history = [];
                save();
                renderHistory();
            }
        }
    }

    function renderHistory() {
        const container = document.getElementById('main-content');
        container.innerHTML = `
            <div class="history-container">
                <h2 style="text-transform:uppercase; font-size:13px; color:#8E8E93; margin-bottom:20px; letter-spacing:1px">Evolução de Performance</h2>
                <div id="charts"></div>
                <div class="action-footer">
                    <button class="btn-action btn-danger" onclick="clearHistory()">Apagar Todo o Histórico</button>
                </div>
            </div>`;
        
        const chartsDiv = document.getElementById('charts');
        const allExercises = [];
        Object.keys(plan).forEach(d => allExercises.push(...plan[d].exercises));

        allExercises.forEach(exName => {
            const canvasId = `chart-${exName.replace(/\s/g, '')}`;
            const exData = history.map(h => {
                const entry = Object.keys(h.data).find(k => k.endsWith(`-${exName}`));
                return entry ? parseFloat(h.data[entry].replace(',','.')) || 0 : null;
            }).filter(v => v !== null);

            if(exData.length > 0) {
                chartsDiv.innerHTML += `<p style="font-size:14px; font-weight:600; margin-bottom:10px; color: var(--braun-orange)">${exName.toUpperCase()}</p><canvas id="${canvasId}"></canvas>`;
                setTimeout(() => createChart(canvasId, exData), 100);
            }
        });
        if(history.length === 0) chartsDiv.innerHTML = "<p style='color:#666'>Ainda não há dados guardados.</p>";
    }

    function createChart(id, dataPoints) {
        const ctx = document.getElementById(id).getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: history.map(h => h.date).slice(-dataPoints.length),
                datasets: [{
                    label: 'KG',
                    data: dataPoints,
                    borderColor: '#FF5500',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(255, 85, 0, 0.1)',
                    pointRadius: 4,
                    pointBackgroundColor: '#FF5500'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { 
                    y: { grid: { color: '#2C2C2E' }, ticks: { color: '#8E8E93' } },
                    x: { grid: { display: false }, ticks: { color: '#8E8E93' } }
                },
                plugins: { legend: { display: false } }
            }
        });
        document.getElementById(id).style.height = "200px";
    }

    function startTimer(s) {
        clearInterval(timerInterval);
        let t = s;
        timerInterval = setInterval(() => {
            t--;
            const mins = String(Math.floor(t / 60)).padStart(2, '0');
            const secs = String(t % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `STOPWATCH: ${mins}:${secs}`;
            if(t <= 0) { 
                clearInterval(timerInterval); 
                document.getElementById('timer-display').innerText = "ACTION!";
                if(window.navigator.vibrate) window.navigator.vibrate([200, 100, 200]);
            }
        }, 1000);
    }
    function resetTimer() { clearInterval(timerInterval); document.getElementById('timer-display').innerText = "STOPWATCH: 00:00"; }

    switchTab('A1');
</script>
</body>
</html>
