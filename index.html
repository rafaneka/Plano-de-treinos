<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meu Ginásio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --primary: #007AFF;
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #1c1c1e;
            --secondary: #8e8e93;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: var(--text);
            padding-bottom: 100px; /* Espaço para o menu inferior */
        }

        header {
            padding: 60px 20px 20px;
            background: var(--card);
            border-bottom: 1px solid #d1d1d6;
        }

        h1 { margin: 0; font-size: 24px; }
        .day-info { color: var(--secondary); font-size: 14px; margin-top: 5px; }

        /* Navegação Superior */
        .nav-tabs {
            display: flex;
            background: var(--card);
            padding: 10px;
            overflow-x: auto;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #d1d1d6;
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            background: #e5e5ea;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Lista de Exercícios */
        .exercise-list { padding: 20px; }
        
        .card {
            background: var(--card);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .card.completed {
            opacity: 0.5;
            transform: scale(0.98);
            background: #f8f8f8;
        }

        .info h3 { margin: 0; font-size: 17px; }
        .details { font-size: 13px; color: var(--secondary); margin-top: 4px; }
        .meta { display: flex; gap: 10px; margin-top: 6px; }
        .tag { background: #f2f2f7; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }

        .check-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #d1d1d6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: transparent;
        }

        .completed .check-circle {
            background: #34c759;
            border-color: #34c759;
            color: white;
        }

        /* Botão de Reset */
        .reset-container { padding: 0 20px; text-align: center; }
        .reset-btn { color: var(--primary); border: none; background: none; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h1 id="current-day-title">Treino A1</h1>
    <div class="day-info" id="day-desc">Superior - Força</div>
</header>

<nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchDay('A1')">A1</button>
    <button class="tab-btn" onclick="switchDay('B1')">B1</button>
    <button class="tab-btn" onclick="switchDay('A2')">A2</button>
    <button class="tab-btn" onclick="switchDay('B2')">B2</button>
</nav>

<div class="exercise-list" id="exercise-list">
    </div>

<div class="reset-container">
    <button class="reset-btn" onclick="resetProgress()">Reiniciar Treino de Hoje</button>
</div>

<script>
    const workouts = {
        'A1': {
            title: 'Dia 1 - A1',
            desc: 'Superior (Força/Hipertrofia)',
            exercises: [
                { name: 'Supino com Halteres', sets: '3x8-10', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Remada Curvada com Barra', sets: '3x8-10', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Press Militar com Halteres', sets: '3x8-10', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Lat Pulldown na Polia', sets: '3x8-10', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Tríceps Corda + Bíceps Martelo', sets: '3x8-10', meta: 'Supersérie | RPE 8-9' }
            ]
        },
        'B1': {
            title: 'Dia 2 - B1',
            desc: 'Inferior (Força)',
            exercises: [
                { name: 'Agachamento Livre / Leg Press', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Peso Morto Romeno', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Leg Extension na Máquina', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Gémeos em Pé', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Máquina de Abdominais', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' }
            ]
        },
        'A2': {
            title: 'Dia 3 - A2',
            desc: 'Superior (Volume)',
            exercises: [
                { name: 'Supino Inclinado c/ Halteres', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Remada Baixa no Cabo', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Elevações Laterais', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Face Pulls na Polia', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Fundos (Dips) ou Flexões', sets: '3x10-12', meta: 'Rest 60s | RPE 8-9' }
            ]
        },
        'B2': {
            title: 'Dia 4 - B2',
            desc: 'Inferior (Volume)',
            exercises: [
                { name: 'Lunges Dinâmicos', sets: '3x12-15', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Leg Curl Sentado/Deitado', sets: '3x12-15', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Goblet Squat c/ Halter', sets: '3x12-15', meta: 'Rest 60s | RPE 8-9' },
                { name: 'Prancha Abdominal', sets: '3 sets', meta: 'Rest 60s' },
                { name: 'Gémeos Sentado', sets: '3x12-15', meta: 'Rest 60s | RPE 8-9' }
            ]
        }
    };

    let currentDay = 'A1';
    let progress = JSON.parse(localStorage.getItem('gym_progress')) || {};

    function switchDay(day) {
        currentDay = day;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === day);
        });
        render();
    }

    function toggleExercise(index) {
        const key = `${currentDay}-${index}`;
        progress[key] = !progress[key];
        localStorage.setItem('gym_progress', JSON.stringify(progress));
        render();
    }

    function resetProgress() {
        if(confirm("Reiniciar o progresso deste treino?")) {
            Object.keys(progress).forEach(key => {
                if(key.startsWith(currentDay)) delete progress[key];
            });
            localStorage.setItem('gym_progress', JSON.stringify(progress));
            render();
        }
    }

    function render() {
        const data = workouts[currentDay];
        document.getElementById('current-day-title').innerText = data.title;
        document.getElementById('day-desc').innerText = data.desc;

        const list = document.getElementById('exercise-list');
        list.innerHTML = data.exercises.map((ex, i) => {
            const isDone = progress[`${currentDay}-${i}`];
            return `
                <div class="card ${isDone ? 'completed' : ''}" onclick="toggleExercise(${i})">
                    <div class="info">
                        <h3>${ex.name}</h3>
                        <div class="details">${ex.sets}</div>
                        <div class="meta"><span class="tag">${ex.meta}</span></div>
                    </div>
                    <div class="check-circle">✓</div>
                </div>
            `;
        }).join('');
    }

    render();
</script>
</body>
</html>
