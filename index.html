<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gym Tracker Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --braun-black: #000000;
            --braun-dark-grey: #1C1C1E;
            --braun-orange: #FF5500;
            --braun-light: #FFFFFF;
            --apple-grey: #2C2C2E;
            --squircle: 22px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
            background: var(--braun-black); 
            color: var(--braun-light);
            margin: 0; 
            padding-top: 130px; 
            padding-bottom: 40px;
        }

        /* Bloqueio de Rotação */
        #orientation-lock {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--braun-black); z-index: 9999; text-align: center;
            justify-content: center; align-items: center; flex-direction: column;
        }
        @media screen and (orientation: landscape) { #orientation-lock { display: flex; } }

        /* Header Braun */
        #timer-bar { 
            position: fixed; top: 0; width: 100%; background: var(--braun-orange); 
            color: white; padding: 55px 0 15px; text-align: center; z-index: 100;
            font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Navegação */
        .nav-days { 
            display: flex; overflow-x: auto; padding: 15px; gap: 12px; 
            background: rgba(28, 28, 30, 0.8); backdrop-filter: blur(15px);
            position: sticky; top: 110px; z-index: 90;
        }
        .tab-btn { 
            padding: 12px 24px; border-radius: 14px; border: none; 
            background: var(--apple-grey); color: var(--braun-light);
            font-size: 13px; font-weight: 600; white-space: nowrap;
        }
        .tab-btn.active { background: var(--braun-light); color: var(--braun-black); }
        .tab-history { background: var(--braun-orange) !important; color: white !important; }

        /* Cards e Listas */
        .exercise-card, .history-day-card { 
            background: var(--braun-dark-grey); margin: 12px; padding: 20px; 
            border-radius: var(--squircle);
        }

        /* Acordeão Histórico */
        .history-day-header {
            font-size: 18px; font-weight: 700; color: var(--braun-orange);
            padding: 10px 0; border-bottom: 1px solid var(--apple-grey);
            margin-bottom: 10px; display: flex; justify-content: space-between;
        }
        .history-ex-item {
            padding: 15px 0; border-bottom: 1px solid #2C2C2E;
        }
        .history-ex-item:last-child { border: none; }
        .ex-label { font-size: 15px; font-weight: 500; display: block; }
        
        .chart-wrapper {
            max-width: 768px; margin: 15px auto;
            display: none; /* Escondido por defeito */
        }
        .chart-wrapper.active { display: block; }
        
        canvas { 
            width: 100% !important; height: auto !important; 
            aspect-ratio: 2 / 1; background: #121212;
            border-radius: 12px; padding: 10px;
        }

        /* Inputs e Botões */
        .track-row { display: flex; gap: 12px; margin-top: 15px; }
        input[type="text"] { 
            background: var(--apple-grey); border: none; color: white;
            padding: 14px; width: 85px; border-radius: 14px; text-align: center;
        }
        .check-btn { 
            flex-grow: 1; background: var(--apple-grey); color: white; border: none; 
            border-radius: 14px; font-weight: 700;
        }
        .check-btn.done { background: var(--braun-orange); }

        .btn-action { 
            width: calc(100% - 30px); margin: 10px 15px; padding: 16px; 
            border-radius: 16px; border: none; font-weight: 600;
        }
        .btn-danger { color: #FF453A; background: rgba(255, 69, 58, 0.1); margin-top: 40px; }

    </style>
</head>
<body>

<div id="orientation-lock">
    <div style="font-size: 50px;">📱</div>
    <h2 style="margin-top:20px">Modo Vertical Obrigatório</h2>
</div>

<div id="timer-bar">
    <div id="timer-display">STOPWATCH: 00:00</div>
    <div style="margin-top:10px; display: flex; justify-content: center; gap: 10px;">
        <button class="tab-btn" style="background:rgba(0,0,0,0.3); padding: 8px 15px;" onclick="startTimer(60)">+60S</button>
        <button class="tab-btn" style="background:rgba(0,0,0,0.3); padding: 8px 15px;" onclick="resetTimer()">OFF</button>
    </div>
</div>

<div class="nav-days" id="day-tabs"></div>
<div id="main-content"></div>

<script>
    const defaultPlan = {
        'A1': { title: 'Superior A1', exercises: ['Supino com Halteres', 'Remada Curvada com Barra', 'Press Militar com Halteres', 'Lat Pulldown na Polia', 'Tríceps Corda + Bíceps Martelo']},
        'B1': { title: 'Inferior B1', exercises: ['Agachamento / Leg Press', 'Peso Morto Romeno', 'Leg Extension Máquina', 'Gémeos em Pé', 'Máquina de Abdominais']},
        'A2': { title: 'Superior A2', exercises: ['Supino Inclinado c/ Halteres', 'Remada Baixa no Cabo', 'Elevação Laterais Halteres', 'Face Pulls Polia Alta', 'Fundos ou Flexões']},
        'B2': { title: 'Inferior B2', exercises: ['Lunges Dinâmicos', 'Leg Curl Sentado/Deitado', 'Goblet Squat com Halteres', 'Prancha Abdominal', 'Gémeos Sentado Máquina']}
    };

    let plan = JSON.parse(localStorage.getItem('gym_plan')) || defaultPlan;
    let logs = JSON.parse(localStorage.getItem('gym_logs')) || {};
    let history = JSON.parse(localStorage.getItem('gym_history')) || [];
    let currentTab = 'A1';
    let timerInterval;

    function save() {
        localStorage.setItem('gym_plan', JSON.stringify(plan));
        localStorage.setItem('gym_logs', JSON.stringify(logs));
        localStorage.setItem('gym_history', JSON.stringify(history));
    }

    function renderTabs() {
        const container = document.getElementById('day-tabs');
        let html = Object.keys(plan).map(day => `
            <button class="tab-btn ${day === currentTab ? 'active' : ''}" onclick="switchTab('${day}')">${day}</button>
        `).join('');
        html += `<button class="tab-btn tab-history ${currentTab === 'HIST' ? 'active' : ''}" onclick="switchTab('HIST')">HISTÓRICO</button>`;
        container.innerHTML = html;
    }

    function switchTab(tab) {
        currentTab = tab;
        renderTabs();
        window.scrollTo(0,0);
        if(tab === 'HIST') renderHistory(); else renderExercises();
    }

    function renderExercises() {
        const container = document.getElementById('main-content');
        const data = plan[currentTab];
        container.innerHTML = data.exercises.map(ex => {
            const val = logs[`${currentTab}-${ex}`] || "";
            return `
                <div class="exercise-card">
                    <div style="font-size:18px; font-weight:600">${ex}</div>
                    <div class="track-row">
                        <input type="text" inputmode="decimal" placeholder="KG" value="${val}" onchange="saveLog('${currentTab}-${ex}', this.value)">
                        <button class="check-btn" onclick="toggleDone(this)">SET DONE</button>
                    </div>
                </div>
            `;
        }).join('') + `
            <button class="btn-action" style="background:var(--braun-orange); color:white;" onclick="handleReset()">Finalizar e Guardar Cargas</button>
            <button class="btn-action" style="background:var(--apple-grey); color:white;" onclick="logs={}; renderExercises();">Reset Diário</button>
        `;
    }

    function toggleDone(btn) {
        btn.classList.toggle('done');
        if(btn.classList.contains('done')) startTimer(60);
    }

    function saveLog(key, val) { logs[key] = val; save(); }

    function handleReset() {
        if(!confirm("Guardar estas cargas no histórico?")) return;
        history.push({ date: new Date().toLocaleDateString(), data: {...logs} });
        logs = {}; save(); renderExercises();
    }

    // LÓGICA DO HISTÓRICO EXPANSÍVEL
    function renderHistory() {
        const container = document.getElementById('main-content');
        if(history.length === 0) {
            container.innerHTML = "<p style='text-align:center; padding:50px; color:#666'>Sem dados guardados.</p>";
            return;
        }

        let html = '<div class="history-container">';
        
        Object.keys(plan).forEach(dayKey => {
            html += `
                <div class="history-day-card">
                    <div class="history-day-header">DIA ${dayKey} <span>↓</span></div>
                    <div class="day-exercises-list">
                        ${plan[dayKey].exercises.map(ex => {
                            const canvasId = `chart-${dayKey}-${ex.replace(/\s/g, '')}`;
                            return `
                                <div class="history-ex-item" onclick="toggleChart('${canvasId}', '${dayKey}', '${ex}')">
                                    <span class="ex-label">${ex}</span>
                                    <div id="wrapper-${canvasId}" class="chart-wrapper">
                                        <canvas id="${canvasId}"></canvas>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
        });

        html += `<button class="btn-action btn-danger" onclick="clearHistory()">Apagar Todo o Histórico</button></div>`;
        container.innerHTML = html;
    }

    function toggleChart(canvasId, dayKey, exName) {
        const wrapper = document.getElementById(`wrapper-${canvasId}`);
        const isActive = wrapper.classList.contains('active');
        
        // Fechar todos os outros para manter limpo
        document.querySelectorAll('.chart-wrapper').forEach(w => w.classList.remove('active'));
        
        if(!isActive) {
            wrapper.classList.add('active');
            renderBarChart(canvasId, dayKey, exName);
        }
    }

    function renderBarChart(canvasId, dayKey, exName) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        const dataPoints = history.map(h => {
            const val = h.data[`${dayKey}-${exName}`];
            return val ? parseFloat(val.replace(',','.')) : null;
        }).filter(v => v !== null);

        const labels = history.map(h => h.date).slice(-dataPoints.length);

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'KG',
                    data: dataPoints,
                    backgroundColor: '#FF5500',
                    borderRadius: 6,
                    barThickness: 20
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                aspectRatio: 2,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#2C2C2E' }, ticks: { color: '#8E8E93', font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { color: '#8E8E93', font: { size: 10 } } }
                }
            }
        });
    }

    function clearHistory() {
        if(confirm("Apagar todo o histórico?") && confirm("Tens mesmo a certeza?")) {
            history = []; save(); renderHistory();
        }
    }

    // TIMER
    function startTimer(s) {
        clearInterval(timerInterval);
        let t = s;
        timerInterval = setInterval(() => {
            t--;
            const m = String(Math.floor(t/60)).padStart(2,'0');
            const s_ = String(t%60).padStart(2,'0');
            document.getElementById('timer-display').innerText = `STOPWATCH: ${m}:${s_}`;
            if(t <= 0) { clearInterval(timerInterval); document.getElementById('timer-display').innerText = "ACTION!"; }
        }, 1000);
    }
    function resetTimer() { clearInterval(timerInterval); document.getElementById('timer-display').innerText = "STOPWATCH: 00:00"; }

    switchTab('A1');
</script>
</body>
</html>
