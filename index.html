<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GymTracker Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --primary: #007AFF; --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; }
        body { font-family: -apple-system, system-ui; background: var(--bg); margin: 0; padding-top: 110px; padding-bottom: 50px; }
        
        /* Temporizador Fixo */
        #timer-bar { position: fixed; top: 0; width: 100%; background: var(--primary); color: white; padding: 50px 0 10px; text-align: center; z-index: 100; font-weight: bold; font-variant-numeric: tabular-nums; }
        .timer-controls { display: flex; justify-content: center; gap: 15px; margin-top: 5px; }
        .timer-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 15px; border-radius: 8px; font-size: 12px; }

        /* Navegação */
        .nav-days { display: flex; overflow-x: auto; padding: 10px; gap: 8px; background: var(--card); border-bottom: 1px solid #d1d1d6; }
        .tab-btn { padding: 8px 16px; border-radius: 12px; border: none; background: #e5e5ea; font-weight: 600; white-space: nowrap; }
        .tab-btn.active { background: var(--text); color: white; }

        /* Exercícios */
        .exercise-card { background: var(--card); margin: 12px; padding: 16px; border-radius: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .ex-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .ex-name { font-weight: bold; font-size: 17px; margin: 0; }
        .ex-meta { color: #8e8e93; font-size: 13px; }
        
        /* Inputs de Carga */
        .track-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f2f2f7; }
        input[type="text"] { border: 1px solid #d1d1d6; padding: 8px; border-radius: 8px; width: 80px; text-align: center; font-size: 14px; }
        .check-btn { flex-grow: 1; background: #34c759; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; }
        .check-btn.done { background: #8e8e93; }

        /* Controles de Edição */
        .admin-bar { padding: 10px 20px; display: flex; gap: 10px; }
        .edit-mode .delete-ex { display: block; color: #ff3b30; margin-top: 10px; font-size: 12px; border: none; background: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="timer-bar">
    <div id="timer-display">DESCANSO: 00:00</div>
    <div class="timer-controls">
        <button class="timer-btn" onclick="startTimer(60)">+60s</button>
        <button class="timer-btn" onclick="resetTimer()">Reset</button>
    </div>
</div>

<div class="nav-days" id="day-tabs"></div>

<div class="admin-bar">
    <button class="tab-btn" onclick="addExercise()">+ Exercício</button>
    <button class="tab-btn" onclick="addDay()">+ Dia</button>
    <button class="tab-btn" style="background:#ff3b30; color:white;" onclick="clearAllData()">Limpar Tudo</button>
</div>

<div id="exercise-container"></div>

<script>
    // Estrutura Inicial (se não houver dados no telemóvel)
    const defaultPlan = {
        'A1': { title: 'Superior A1', exercises: [
            { name: 'Supino Halteres', sets: '3x8-10', meta: 'RPE 8-9' },
            { name: 'Remada Curvada', sets: '3x8-10', meta: 'RPE 8-9' }
        ]},
        'B1': { title: 'Inferior B1', exercises: [{ name: 'Agachamento', sets: '3x10-12', meta: 'RPE 8-9' }]}
    };

    let plan = JSON.parse(localStorage.getItem('gym_plan')) || defaultPlan;
    let logs = JSON.parse(localStorage.getItem('gym_logs')) || {};
    let currentDay = Object.keys(plan)[0];
    let timerInterval;

    function save() {
        localStorage.setItem('gym_plan', JSON.stringify(plan));
        localStorage.setItem('gym_logs', JSON.stringify(logs));
    }

    function renderTabs() {
        const container = document.getElementById('day-tabs');
        container.innerHTML = Object.keys(plan).map(day => `
            <button class="tab-btn ${day === currentDay ? 'active' : ''}" onclick="switchDay('${day}')">${day}</button>
        `).join('');
    }

    function switchDay(day) {
        currentDay = day;
        renderTabs();
        renderExercises();
    }

    function renderExercises() {
        const container = document.getElementById('exercise-container');
        const data = plan[currentDay];
        container.innerHTML = data.exercises.map((ex, i) => {
            const logKey = `${currentDay}-${ex.name}`;
            const currentVal = logs[logKey] || "";
            return `
                <div class="exercise-card">
                    <div class="ex-header">
                        <div>
                            <p class="ex-name" onclick="editEx(${i})">${ex.name}</p>
                            <span class="ex-meta">${ex.sets} | ${ex.meta}</span>
                        </div>
                        <button class="delete-ex" onclick="removeEx(${i})">Remover</button>
                    </div>
                    <div class="track-row">
                        <input type="text" placeholder="Peso/Obs" value="${currentVal}" 
                               onchange="saveLog('${logKey}', this.value)">
                        <button class="check-btn" onclick="this.classList.toggle('done'); startTimer(60)">Feito</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function saveLog(key, val) {
        logs[key] = val;
        save();
    }

    // Funções de Temporizador
    function startTimer(seconds) {
        clearInterval(timerInterval);
        let t = seconds;
        timerInterval = setInterval(() => {
            t--;
            const mins = String(Math.floor(t / 60)).padStart(2, '0');
            const secs = String(t % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `DESCANSO: ${mins}:${secs}`;
            if (t <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer-display').innerText = "TREINA!";
                window.navigator.vibrate?.(200);
            }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(timerInterval);
        document.getElementById('timer-display').innerText = "DESCANSO: 00:00";
    }

    // Edição do Plano
    function addExercise() {
        const name = prompt("Nome do exercício:");
        if(!name) return;
        const sets = prompt("Séries/Reps (ex: 3x10):");
        plan[currentDay].exercises.push({ name, sets, meta: 'RPE 8' });
        save();
        renderExercises();
    }

    function addDay() {
        const id = prompt("ID do dia (ex: C1):");
        if(!id) return;
        plan[id] = { title: id, exercises: [] };
        save();
        switchDay(id);
    }

    function removeEx(index) {
        if(confirm("Remover este exercício?")) {
            plan[currentDay].exercises.splice(index, 1);
            save();
            renderExercises();
        }
    }

    function clearAllData() {
        if(confirm("Isto apagará todo o teu plano e registos. Tens a certeza?")) {
            localStorage.clear();
            location.reload();
        }
    }

    // Inicialização
    renderTabs();
    renderExercises();
</script>
</body>
</html>
