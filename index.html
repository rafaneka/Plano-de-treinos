<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gym Braun</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --braun-black: #121212;
            --braun-dark-grey: #1E1E1E;
            --braun-orange: #FF5500; /* Laranja clássico Braun */
            --braun-light: #F5F5F5;
            --braun-grey: #3A3A3A;
        }

        body { 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            background: var(--braun-black); 
            color: var(--braun-light);
            margin: 0; 
            padding-top: 120px; 
            padding-bottom: 40px;
            -webkit-font-smoothing: antialiased;
        }

        /* Bloqueio Visual de Rotação (CSS) */
        @media screen and (orientation:landscape) {
            body { transform: rotate(-90deg); }
        }

        /* Header Laranja Braun */
        #timer-bar { 
            position: fixed; top: 0; width: 100%; 
            background: var(--braun-orange); 
            color: white; 
            padding: 55px 0 15px; 
            text-align: center; z-index: 100;
            font-weight: 700; letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Navegação Minimalista */
        .nav-days { 
            display: flex; overflow-x: auto; padding: 15px; gap: 10px; 
            background: var(--braun-dark-grey); 
            position: sticky; top: 110px; z-index: 90;
        }
        .tab-btn { 
            padding: 10px 20px; border-radius: 4px; border: none; 
            background: var(--braun-grey); color: var(--braun-light);
            font-size: 12px; font-weight: bold; text-transform: uppercase;
        }
        .tab-btn.active { background: var(--braun-light); color: var(--braun-black); }
        .tab-history { background: var(--braun-orange) !important; color: white !important; }

        /* Cards de Exercício */
        .exercise-card { 
            background: var(--braun-dark-grey); margin: 15px; padding: 20px; 
            border-radius: 2px; border-left: 4px solid var(--braun-grey);
        }
        .ex-name { font-size: 18px; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
        .ex-meta { color: #888; font-size: 12px; margin-bottom: 15px; display: block; }
        
        .track-row { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { 
            background: #2A2A2A; border: 1px solid var(--braun-grey); 
            color: white; padding: 12px; width: 80px; border-radius: 0; font-size: 14px;
        }
        .check-btn { 
            flex-grow: 1; background: var(--braun-grey); color: white; border: none; 
            padding: 12px; font-weight: bold; border-radius: 0; text-transform: uppercase;
        }
        .check-btn.done { background: var(--braun-orange); }

        /* Histórico e Gráficos */
        .history-container { padding: 20px; }
        canvas { background: #1a1a1a; padding: 10px; margin-bottom: 30px; border-radius: 4px; }

        .reset-section { text-align: center; padding: 30px; }
        .btn-reset { 
            background: none; border: 1px solid #ff3b30; color: #ff3b30; 
            padding: 10px 30px; font-size: 12px; text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="timer-bar">
    <div id="timer-display">STOPWATCH: 00:00</div>
    <div style="margin-top:8px">
        <button class="tab-btn" style="background:rgba(0,0,0,0.3)" onclick="startTimer(60)">+60S</button>
        <button class="tab-btn" style="background:rgba(0,0,0,0.3)" onclick="resetTimer()">OFF</button>
    </div>
</div>

<div class="nav-days" id="day-tabs"></div>

<div id="main-content"></div>

<script>
    const defaultPlan = {
        'A1': { title: 'A1', exercises: ['Supino com Halteres', 'Remada Curvada com Barra', 'Press Militar com Halteres', 'Lat Pulldown na Polia', 'Tríceps Corda + Bíceps Martelo']},
        'B1': { title: 'B1', exercises: ['Agachamento / Leg Press', 'Peso Morto Romeno', 'Leg Extension Máquina', 'Gémeos em Pé', 'Máquina de Abdominais']},
        'A2': { title: 'A2', exercises: ['Supino Inclinado c/ Halteres', 'Remada Baixa no Cabo', 'Elevação Laterais Halteres', 'Face Pulls Polia Alta', 'Fundos ou Flexões']},
        'B2': { title: 'B2', exercises: ['Lunges Dinâmicos', 'Leg Curl Sentado/Deitado', 'Goblet Squat com Halteres', 'Prancha Abdominal', 'Gémeos Sentado Máquina']}
    };

    let plan = JSON.parse(localStorage.getItem('gym_plan')) || defaultPlan;
    let logs = JSON.parse(localStorage.getItem('gym_logs')) || {};
    let history = JSON.parse(localStorage.getItem('gym_history')) || [];
    let currentTab = 'A1';
    let timerInterval;

    function save() {
        localStorage.setItem('gym_plan', JSON.stringify(plan));
        localStorage.setItem('gym_logs', JSON.stringify(logs));
        localStorage.setItem('gym_history', JSON.stringify(history));
    }

    function renderTabs() {
        const container = document.getElementById('day-tabs');
        let html = Object.keys(plan).map(day => `
            <button class="tab-btn ${day === currentTab ? 'active' : ''}" onclick="switchTab('${day}')">${day}</button>
        `).join('');
        html += `<button class="tab-btn tab-history ${currentTab === 'HIST' ? 'active' : ''}" onclick="switchTab('HIST')">HISTÓRICO</button>`;
        container.innerHTML = html;
    }

    function switchTab(tab) {
        currentTab = tab;
        renderTabs();
        if(tab === 'HIST') renderHistory(); else renderExercises();
    }

    function renderExercises() {
        const container = document.getElementById('main-content');
        const data = plan[currentTab];
        container.innerHTML = data.exercises.map((ex, i) => {
            const val = logs[`${currentTab}-${ex}`] || "";
            return `
                <div class="exercise-card">
                    <div class="ex-name">${ex}</div>
                    <span class="ex-meta">REGISTO DE CARGA ATUAL</span>
                    <div class="track-row">
                        <input type="text" placeholder="KG" value="${val}" onchange="saveLog('${currentTab}-${ex}', this.value)">
                        <button class="check-btn" onclick="this.classList.toggle('done'); startTimer(60)">SET DONE</button>
                    </div>
                </div>
            `;
        }).join('') + `
            <div class="reset-section">
                <button class="btn-reset" onclick="handleReset()">Reset</button>
            </div>
        `;
    }

    function saveLog(key, val) { logs[key] = val; save(); }

    function handleReset() {
        if(!confirm("Salvar cargas no histórico e limpar treino atual?")) return;
        
        // Guardar snapshot no histórico
        const snapshot = { date: new Date().toLocaleDateString(), data: {...logs} };
        history.push(snapshot);
        
        // Limpar logs atuais para o próximo treino
        logs = {};
        save();
        renderExercises();
    }

    function renderHistory() {
        const container = document.getElementById('main-content');
        container.innerHTML = '<div class="history-container"><h2 style="text-transform:uppercase; font-size:14px">Evolução de Cargas</h2><div id="charts"></div></div>';
        
        const chartsDiv = document.getElementById('charts');
        
        // Agrupar todos os exercícios únicos do plano
        const allExercises = [];
        Object.keys(plan).forEach(d => allExercises.push(...plan[d].exercises));

        allExercises.forEach(exName => {
            const canvasId = `chart-${exName.replace(/\s/g, '')}`;
            const exData = history.map(h => {
                // Procurar a carga deste exercício em qualquer dia do log histórico
                const entry = Object.keys(h.data).find(k => k.endsWith(`-${exName}`));
                return entry ? parseFloat(h.data[entry]) || 0 : null;
            }).filter(v => v !== null);

            if(exData.length > 0) {
                chartsDiv.innerHTML += `<p style="font-size:12px; color:#888; margin-bottom:5px">${exName.toUpperCase()}</p><canvas id="${canvasId}"></canvas>`;
                setTimeout(() => createChart(canvasId, exData), 100);
            }
        });
    }

    function createChart(id, dataPoints) {
        const ctx = document.getElementById(id).getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: history.map(h => h.date).slice(-dataPoints.length),
                datasets: [{
                    label: 'KG',
                    data: dataPoints,
                    borderColor: '#FF5500',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: false,
                    pointBackgroundColor: '#FF5500'
                }]
            },
            options: {
                responsive: true,
                scales: { 
                    y: { grid: { color: '#333' }, ticks: { color: '#888' } },
                    x: { grid: { display: false }, ticks: { color: '#888' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    // Timer Logic
    function startTimer(s) {
        clearInterval(timerInterval);
        let t = s;
        timerInterval = setInterval(() => {
            t--;
            const mins = String(Math.floor(t / 60)).padStart(2, '0');
            const secs = String(t % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `STOPWATCH: ${mins}:${secs}`;
            if(t <= 0) { clearInterval(timerInterval); document.getElementById('timer-display').innerText = "ACTION!"; }
        }, 1000);
    }
    function resetTimer() { clearInterval(timerInterval); document.getElementById('timer-display').innerText = "STOPWATCH: 00:00"; }

    switchTab('A1');
</script>
</body>
</html>
